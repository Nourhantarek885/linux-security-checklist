<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Linux Security Checklist</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🐧 Linux Security Checklist</h1>

        <p>
            A beginner-friendly checklist for learning
            basic Linux security concepts.
        </p>

        <div class="checklist">

            <label>
                <input type="checkbox">
                Understand Linux users and groups
            </label>

            <label>
                <input type="checkbox">
                Learn file permissions
            </label>

            <label>
                <input type="checkbox">
                Understand sudo
            </label>

            <label>
                <input type="checkbox">
                Learn basic Linux commands
            </label>

            <label>
                <input type="checkbox">
                Understand processes
            </label>

            <label>
                <input type="checkbox">
                Learn SSH basics
            </label>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
